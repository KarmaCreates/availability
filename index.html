<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Availability Table</title>
    <link rel='stylesheet' href="styles.css">
</head>
<body>
  <table>
    <thead>  
      <tr>
        <th>Time</th>
        <th>Sunday</th>    
        <th>Monday</th>
        <th>Tuesday</th>
        <th>Wednesday</th>
        <th>Thursday</th>
        <th>Friday</th>
        <th>Saturday</th>
      </tr>
    </thead>
    <tbody>    
      <tr class="sharp">
        <th class="time">9:00 am</th>
        <td class="available-0"></td>
        <td class="available-1"></td>
        <td class="available-4"></td>
        <td class="available-0"></td>
        <td class="available-0"></td>
        <td class="available-1"></td>
        <td class="available-2"></td>
      </tr>
      <tr class="half">
        <th class="time">9:30 am</th>
        <td class="available-1"></td>
        <td class="available-2"></td>
        <td class="available-4"></td>
        <td class="available-0"></td>
        <td class="available-0"></td>
        <td class="available-2"></td>
        <td class="available-3"></td>
      </tr>    
      <tr class="sharp">    
        <th class="time">10:00 am</th>
        <td class="available-1"></td>
        <td class="available-2"></td>
        <td class="available-3"></td>
        <td class="available-2"></td>
        <td class="available-1"></td>
        <td class="available-3"></td>
        <td class="available-4"></td>
      </tr>
      <tr class="half">
        <th class="time">10:30 am</th>
        <td class="available-2"></td>
        <td class="available-3"></td>
        <td class="available-3"></td>
        <td class="available-3"></td>
        <td class="available-2"></td>
        <td class="available-4"></td>
        <td class="available-5"></td>
      </tr>   
      <tr class="sharp">
        <th class="time">11:00 am</th>
        <td class="available-3"></td>
        <td class="available-0"></td>
        <td class="available-4"></td>
        <td class="available-4"></td>
        <td class="available-2"></td>
        <td class="available-5"></td>
        <td class="available-0"></td>
      </tr>
      <tr class="half">
        <th class="time">11:30 am</th>
        <td class="available-0"></td>
        <td class="available-0"></td>
        <td class="available-5"></td>
        <td class="available-4"></td>
        <td class="available-3"></td>
        <td class="available-0"></td>
        <td class="available-0"></td>
      </tr>
      <tr class="sharp">
        <th class="time">12:00 pm</th>
        <td class="available-1"></td>
        <td class="available-3"></td>
        <td class="available-1"></td>
        <td class="available-0"></td>
        <td class="available-3"></td>
        <td class="available-1"></td>
        <td class="available-0"></td> 
      </tr>
      <tr class="half">
        <th class="time">12:30 pm</th>
        <td class="available-1"></td>
        <td class="available-2"></td>
        <td class="available-2"></td>
        <td class="available-1"></td>
        <td class="available-2"></td>
        <td class="available-1"></td>
        <td class="available-1"></td>
      </tr>
      <tr class="sharp">
        <th class="time">1:00 pm</th>
        <td class="available-2"></td>
        <td class="available-3"></td>
        <td class="available-3"></td>
        <td class="available-2"></td>
        <td class="available-2"></td>
        <td class="available-2"></td>
        <td class="available-1"></td>
      </tr>
      <tr class="half">
        <th class="time">1:30 pm</th>
        <td class="available-4"></td>
        <td class="available-5"></td>
        <td class="available-3"></td>
        <td class="available-2"></td>
        <td class="available-5"></td>
        <td class="available-2"></td>
        <td class="available-0"></td>
      </tr>      
    </tbody>       
  </table>
  <div id="legend">
    <span>Availability</span>
    <div id="legend-gradient"></div>
  </div>  
</body>

</html>
